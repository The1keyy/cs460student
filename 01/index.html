<!DOCTYPE html>
<html>
  <head>
    <title>CS460 - Hello Cube</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript" src="https://get.goxtk.com/xtk_edge.js"></script>
    <script type="text/javascript">
      window.onload = function() {
        var r = new X.renderer3D();
        r.init();

        var c = new X.cube();
        r.add(c);

        r.render();
      };
    </script>
  </head>
  <body>
  </body>
</html>
